name: is_documents_module
description: >-
  intersyntactic's documents module: what a document holds, as types, and
  pure-Dart readers that turn a file's bytes into one, starting with a Word
  document's text.
version: 0.1.0
repository: https://github.com/intersyntactic/documents_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.6.0
  is_airlock_api: ^0.26.0
  is_document_part_vocabulary: ^0.1.0
  is_flight_rules: ^0.12.0
  is_outcome_vocabulary: ^0.1.0
  is_sign_in_vocabulary: ^0.1.0
  is_tool: ^0.15.0
  is_tool_definition_vocabulary: ^0.8.0
  is_web_request_vocabulary: ^0.1.0
  path: ^1.9.1
  xml: ^7.1.0

dev_dependencies:
  is_conversation_vocabulary: ^0.2.0
  is_file_request_vocabulary: ^0.1.0
  is_model_vocabulary: ^0.5.0
  is_program_request_vocabulary: ^0.1.0
  is_relative_path_vocabulary: ^0.1.0
  is_web_address_vocabulary: ^0.1.2
  lints: ^6.1.0
  test: ^1.33.0
